<title>CFB Model</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--muted:#5d6673;--line:#e3e6eb;--accent:#1f6feb;--bad:#c62f2f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--line:#262d36;--accent:#58a6ff;--bad:#f47067}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
input[type=password]{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font:inherit;outline:none}
input[type=password]:focus{border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted);font-size:13px}
button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 15px/1 inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.foot{margin-top:14px;font-size:11.5px;color:var(--muted)}
</style>

const KEY = "cfbedge_pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(out);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remember){
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(e) {}
    // this tab only: lets the College | NFL switch open the other page without asking again
    try { sessionStorage.setItem(KEY, pw); } catch(e) {}
    show(html);
  } catch(e) {
    try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch(_) {}
    err.textContent = (window.crypto && crypto.subtle) ? "Wrong password." : "This browser can't open the page (needs https).";
    btn.disabled = false; btn.textContent = "Open";
  }
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  tryOpen(document.getElementById("pw").value, document.getElementById("rem").checked);
});
try {
  const kept = localStorage.getItem(KEY), tab = sessionStorage.getItem(KEY);
  if (kept) tryOpen(kept, true); else if (tab) tryOpen(tab, false);
} catch(e) {}
</script>
