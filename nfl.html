  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(out);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remember){
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(e) {}
    // this tab only: lets the College | NFL switch open the other page without asking again
    try { sessionStorage.setItem(KEY, pw); } catch(e) {}
    show(html);
  } catch(e) {
    try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch(_) {}
    err.textContent = (window.crypto && crypto.subtle) ? "Wrong password." : "This browser can't open the page (needs https).";
    btn.disabled = false; btn.textContent = "Open";
  }
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  tryOpen(document.getElementById("pw").value, document.getElementById("rem").checked);
});
try {
  const kept = localStorage.getItem(KEY), tab = sessionStorage.getItem(KEY);
  if (kept) tryOpen(kept, true); else if (tab) tryOpen(tab, false);
} catch(e) {}
</script>
